# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/apiops-cli/main/schemas/v1/override-config.schema.json
backends:
  - name: foundry-backend
    properties:
      url: "https://foundrydeploydemo-prod-ch.openai.azure.com/openai/v1"
  - name: content-safety-backend
    properties:
      url: "https://cs-foundrydeploydemo-prod-ch.cognitiveservices.azure.com"

namedValues:
  - name: foundry-rate-limit-calls
    properties:
      value: "60"

  # Microsoft Entra validation for the demo agents.
  - name: entra-tenant-id
    properties:
      value: "cd48c7b8-9369-443d-8a4c-bd1e53504a09"
  - name: agent-client-application-id
    properties:
      value: "04b07795-8ddb-461a-bbee-02f9e1bf7b46"
  - name: agent-token-audience
    properties:
      value: "22425f2b-4bf5-41c4-b6ce-11f2806ede72"

  # Prod model deployments run at 50K TPM, so tier ceilings are raised accordingly.
  - name: tier-bronze-tokens-per-minute
    properties:
      value: "2500"
  - name: tier-bronze-token-quota
    properties:
      value: "125000"
  - name: tier-silver-tokens-per-minute
    properties:
      value: "12500"
  - name: tier-silver-token-quota
    properties:
      value: "625000"
  - name: tier-gold-tokens-per-minute
    properties:
      value: "50000"
  - name: tier-gold-token-quota
    properties:
      value: "2500000"
