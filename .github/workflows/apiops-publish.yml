name: Publish APIOps artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to publish
        required: true
        type: choice
        default: both
        options:
          - dev
          - prod
          - both

permissions:
  id-token: write
  contents: read

jobs:
  publish-dev:
    if: inputs.target == 'dev' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: apiops-dev
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Dry run dev
        run: |
          npx apiops publish \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.APIM_RESOURCE_GROUP }}" \
            --service-name "${{ vars.APIM_SERVICE_NAME }}" \
            --source ./apim-artifacts \
            --overrides ./apiops/configuration.dev.yaml \
            --dry-run

      - name: Publish dev
        run: |
          npx apiops publish \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.APIM_RESOURCE_GROUP }}" \
            --service-name "${{ vars.APIM_SERVICE_NAME }}" \
            --source ./apim-artifacts \
            --overrides ./apiops/configuration.dev.yaml

  publish-prod:
    if: >-
      always() &&
      (inputs.target == 'prod' || inputs.target == 'both') &&
      (needs.publish-dev.result == 'success' || needs.publish-dev.result == 'skipped')
    needs: publish-dev
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: apiops-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Dry run prod
        run: |
          npx apiops publish \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.APIM_RESOURCE_GROUP }}" \
            --service-name "${{ vars.APIM_SERVICE_NAME }}" \
            --source ./apim-artifacts \
            --overrides ./apiops/configuration.prod.yaml \
            --dry-run

      - name: Publish prod
        run: |
          npx apiops publish \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.APIM_RESOURCE_GROUP }}" \
            --service-name "${{ vars.APIM_SERVICE_NAME }}" \
            --source ./apim-artifacts \
            --overrides ./apiops/configuration.prod.yaml
