name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        default: both
        options:
          - dev
          - prod
          - both

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: inputs.target == 'dev' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: infrastructure-dev
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment
        env:
          DEPLOYMENT_LOCATION: ${{ vars.DEPLOYMENT_LOCATION }}
        run: |
          az deployment sub validate \
            --name "foundry-demo-dev-${GITHUB_RUN_ID}" \
            --location "${DEPLOYMENT_LOCATION:-eastus2}" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/environments/dev.bicepparam

      - name: Deploy dev
        env:
          DEPLOYMENT_LOCATION: ${{ vars.DEPLOYMENT_LOCATION }}
        run: |
          az deployment sub create \
            --name "foundry-demo-dev-${GITHUB_RUN_ID}" \
            --location "${DEPLOYMENT_LOCATION:-eastus2}" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/environments/dev.bicepparam

  deploy-prod:
    if: >-
      always() &&
      (inputs.target == 'prod' || inputs.target == 'both') &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: infrastructure-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment
        env:
          DEPLOYMENT_LOCATION: ${{ vars.DEPLOYMENT_LOCATION }}
        run: |
          az deployment sub validate \
            --name "foundry-demo-prod-${GITHUB_RUN_ID}" \
            --location "${DEPLOYMENT_LOCATION:-eastus2}" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/environments/prod.bicepparam

      - name: Deploy prod
        env:
          DEPLOYMENT_LOCATION: ${{ vars.DEPLOYMENT_LOCATION }}
        run: |
          az deployment sub create \
            --name "foundry-demo-prod-${GITHUB_RUN_ID}" \
            --location "${DEPLOYMENT_LOCATION:-eastus2}" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/environments/prod.bicepparam
