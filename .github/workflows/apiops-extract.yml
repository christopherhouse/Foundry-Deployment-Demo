name: Extract APIOps baseline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: APIM environment to extract
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Extract managed resources
        run: |
          npx apiops extract \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.APIM_RESOURCE_GROUP }}" \
            --service-name "${{ vars.APIM_SERVICE_NAME }}" \
            --output ./extracted-apim-artifacts \
            --filter ./apiops/configuration.extractor.yaml

      - name: Upload extraction
        uses: actions/upload-artifact@v4
        with:
          name: apim-extraction-${{ inputs.environment }}-${{ github.run_id }}
          path: ./extracted-apim-artifacts
          retention-days: 14

