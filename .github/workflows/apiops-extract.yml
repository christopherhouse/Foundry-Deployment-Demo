name: Extract APIOps artifacts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: APIM environment to extract
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: apiops-extract-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify APIOps version
        run: |
          version="$(npx apiops --version)"
          test "$version" = "1.0.3"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Extract managed resources
        run: |
          npx apiops extract \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.APIM_RESOURCE_GROUP }}" \
            --service-name "${{ vars.APIM_SERVICE_NAME }}" \
            --output ./apim-artifacts \
            --filter ./apiops/configuration.extractor.yaml \
            --remove-stale

      - name: Validate extracted artifacts
        shell: pwsh
        run: ./scripts/Test-ApiOpsArtifacts.ps1

      - name: Upload extraction
        uses: actions/upload-artifact@v4
        with:
          name: apim-extraction-${{ inputs.environment }}-${{ github.run_id }}
          path: ./apim-artifacts
          retention-days: 30

  create-pull-request:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Reset artifact directory
        run: rm -rf ./apim-artifacts

      - name: Download extraction
        uses: actions/download-artifact@v4
        with:
          name: apim-extraction-${{ inputs.environment }}-${{ github.run_id }}
          path: ./apim-artifacts

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: apim-extract-${{ inputs.environment }}-${{ github.run_id }}
          commit-message: 'chore: update APIM artifacts from ${{ inputs.environment }}'
          title: 'chore: update APIM artifacts from ${{ inputs.environment }}'
          body: |
            This PR was generated by the APIOps extraction workflow.

            - Source environment: `${{ inputs.environment }}`
            - Filter: `apiops/configuration.extractor.yaml`
            - Workflow run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

            Review the APIM artifact delta before merging. Environment-specific values belong in `apiops/configuration.<environment>.yaml`.
          add-paths: |
            apim-artifacts
